{% extends "_app_layout.html" %}

{% block title %}Notifications — TaskNest Enterprise{% endblock %}

{% block app_content %}
<div class="page-intro" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
  <div>
    <h1 class="page-title" style="margin-bottom: 0.25rem;">Notifications</h1>
    <p class="page-subtitle" style="margin: 0;">Stay informed about task assignments, review approvals, comments, and schedule updates.</p>
  </div>
  <div style="display: flex; gap: 0.75rem; align-items: center;">
    <button id="page-mark-all-read" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 0.4rem;">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span>Mark All as Read</span>
    </button>
  </div>
</div>

<div class="card" style="padding: 1.25rem;">
  <!-- Filter Pills -->
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); padding-bottom: 0.85rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem;">
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn btn-primary btn-sm notif-filter-btn active" data-filter="all">All (<span id="notif-total-count">0</span>)</button>
      <button class="btn btn-ghost btn-sm notif-filter-btn" data-filter="unread">Unread (<span id="notif-unread-count">0</span>)</button>
    </div>
    <div id="notif-status-indicator" style="font-size: var(--font-size-xs); color: var(--color-muted);">
      Updating live...
    </div>
  </div>

  <!-- Notification Feed -->
  <div id="notifications-feed" style="display: flex; flex-direction: column; gap: 0.75rem;">
    <p class="text-muted" style="text-align: center; padding: 3rem 1rem;">Loading notifications...</p>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
  const feed = document.getElementById('notifications-feed');
  const totalCountBadge = document.getElementById('notif-total-count');
  const unreadCountBadge = document.getElementById('notif-unread-count');
  const statusIndicator = document.getElementById('notif-status-indicator');
  const markAllBtn = document.getElementById('page-mark-all-read');

  let notificationsList = [];
  let currentFilter = 'all';

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getIconForType(type) {
    switch (type) {
      case 'task_assigned':
        return '<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: #25845A;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>';
      case 'submission_review':
      case 'submission_approved':
        return '<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: #25845A;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
      case 'changes_requested':
        return '<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--color-warning);"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
      case 'task_message':
      case 'comment':
        return '<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--color-primary);"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';
      case 'meeting_invite':
      case 'meeting_rsvp':
      case 'meeting_cancelled':
        return '<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--color-accent);"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
      case 'deadline':
      case 'overdue':
        return '<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--color-danger);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';
      default:
        return '<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--color-primary);"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
    }
  }

  async function loadNotificationsData() {
    try {
      const res = await fetch('/api/notifications');
      if (res.ok) {
        const json = await res.json();
        const data = json.data;
        notificationsList = data.notifications || [];
        const unreadCount = data.unread_count || 0;

        if (totalCountBadge) totalCountBadge.textContent = notificationsList.length;
        if (unreadCountBadge) unreadCountBadge.textContent = unreadCount;
        if (statusIndicator) statusIndicator.textContent = `Last refreshed ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

        renderNotifications();
      } else {
        feed.innerHTML = '<div class="alert alert-error">Unable to load notifications. Please try again.</div>';
      }
    } catch (e) {
      feed.innerHTML = '<div class="alert alert-error">Network error loading notifications.</div>';
    }
  }

  function renderNotifications() {
    let items = notificationsList;
    if (currentFilter === 'unread') {
      items = notificationsList.filter(n => !n.is_read);
    }

    if (!items.length) {
      feed.innerHTML = `
        <div style="text-align: center; padding: 3rem 1rem;">
          <svg class="icon" viewBox="0 0 24 24" style="width: 48px; height: 48px; stroke: var(--color-border); margin-bottom: 0.75rem;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <h4 style="margin: 0; color: var(--color-text);">${currentFilter === 'unread' ? 'No unread notifications' : 'No notifications yet'}</h4>
          <p class="text-muted" style="font-size: var(--font-size-xs); margin: 0.35rem 0 0 0;">
            ${currentFilter === 'unread' ? 'You have read all your notifications!' : 'Updates regarding your tasks and meetings will appear here.'}
          </p>
        </div>
      `;
      return;
    }

    feed.innerHTML = items.map(n => {
      const isUnread = !n.is_read;
      const borderLeft = isUnread ? '4px solid var(--color-accent)' : '1px solid var(--color-border)';
      const bg = isUnread ? '#FFFDF9' : 'var(--color-surface)';
      const dateStr = n.created_at ? new Date(n.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      const hasLink = n.link && n.link !== '#' && n.link !== '';

      return `
        <div class="card notif-card-item" style="padding: 1rem 1.25rem; background: ${bg}; border-left: ${borderLeft}; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap;">
          <div style="display: flex; gap: 0.85rem; align-items: flex-start; flex: 1; min-width: 220px;">
            <div style="width: 34px; height: 34px; border-radius: 50%; background: var(--color-surface-subtle); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--color-border-subtle); margin-top: 2px;">
              ${getIconForType(n.type)}
            </div>
            <div style="min-width: 0;">
              <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <span style="font-weight: 700; font-size: var(--font-size-sm); color: var(--color-primary);">${escapeHtml(n.title)}</span>
                ${isUnread ? '<span class="badge badge-high" style="font-size: 0.65rem;">NEW</span>' : ''}
              </div>
              <p style="font-size: var(--font-size-xs); color: var(--color-text-light); margin: 0.25rem 0 0.35rem 0; line-height: 1.5;">${escapeHtml(n.message)}</p>
              <div style="font-size: 0.7rem; color: var(--color-muted);">${dateStr}</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; margin-left: auto;">
            ${hasLink ? `<a href="${n.link}" class="btn btn-secondary btn-xs notif-link-btn" data-id="${n.id}">Open Link →</a>` : ''}
            ${isUnread ? `<button class="btn btn-ghost btn-xs mark-single-read-btn" data-id="${n.id}" style="color: var(--color-muted);">Mark read</button>` : ''}
          </div>
        </div>
      `;
    }).join('');

    // Wire individual mark read buttons
    document.querySelectorAll('.mark-single-read-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const nid = btn.dataset.id;
        await markNotificationRead(nid);
      });
    });

    // Wire open link buttons to mark as read before navigating
    document.querySelectorAll('.notif-link-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const nid = btn.dataset.id;
        await markNotificationRead(nid);
      });
    });
  }

  async function markNotificationRead(notifId) {
    try {
      await fetch(`/api/notifications/${notifId}/read`, {
        method: 'PATCH',
        headers: { 'X-CSRFToken': csrf }
      });
      const target = notificationsList.find(n => String(n.id) === String(notifId));
      if (target) target.is_read = true;
      loadNotificationsData();
    } catch (e) {}
  }

  // Filter Buttons
  document.querySelectorAll('.notif-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.notif-filter-btn').forEach(b => {
        b.classList.remove('active', 'btn-primary');
        b.classList.add('btn-ghost');
      });
      btn.classList.add('active', 'btn-primary');
      btn.classList.remove('btn-ghost');
      currentFilter = btn.dataset.filter;
      renderNotifications();
    });
  });

  // Mark all read button
  markAllBtn?.addEventListener('click', async () => {
    try {
      await fetch('/api/notifications/mark-all-read', {
        method: 'POST',
        headers: { 'X-CSRFToken': csrf }
      });
      loadNotificationsData();
    } catch (e) {}
  });

  loadNotificationsData();
});
</script>
{% endblock %}
