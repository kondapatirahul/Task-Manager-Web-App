<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TaskNest - Organize Today, Build a Better Tomorrow{% endblock %}</title>
  
  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- TaskNest Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  {% block head %}{% endblock %}
</head>
<body>
  {% include 'partials/_toast.html' %}

  {% block page_wrapper %}
    <!-- Authenticated App Shell Layout (Dashboard, Tasks, etc.) -->
    <div class="app-container">
      {% include 'partials/_sidebar.html' %}
      
      <div class="app-main">
        {% include 'partials/_topbar.html' %}
        
        <main class="app-content">
          {% block content %}
          <!-- Main workspace content injected by M6 and M7 -->
          {% endblock %}
        </main>
      </div>
    </div>
  {% endblock %}

  <!-- Core UI scripts -->
  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  
  {% block scripts %}{% endblock %}
</body>
</html>
