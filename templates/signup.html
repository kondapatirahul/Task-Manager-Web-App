{% extends 'base.html' %}

{% block title %}Create your account - TaskNest{% endblock %}

{% block page_wrapper %}
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="auth-brand-logo" aria-label="TaskNest Home">
        <div class="brand-icon-wrapper" style="background-color: var(--primary); color: #A3E635;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <span>TaskNest</span>
      </a>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Join us and start managing your tasks</p>
    </div>

    <!-- Accessible Global Alert Container -->
    <div id="signupAlert" class="auth-alert" role="alert" aria-live="assertive" style="display: none;"></div>

    <form id="signupForm" novalidate>
      <div class="form-group" id="group-username">
        <label for="username" class="form-label">Full Name</label>
        <div class="input-icon-wrapper">
          <span class="leading-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="input" 
            placeholder="John Doe" 
            autocomplete="name" 
            required 
            aria-required="true"
            aria-describedby="username-error"
          >
        </div>
        <div class="form-error-msg" id="username-error" role="alert"></div>
      </div>

      <div class="form-group" id="group-email">
        <label for="email" class="form-label">Email address</label>
        <div class="input-icon-wrapper">
          <span class="leading-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="input" 
            placeholder="you@example.com" 
            autocomplete="email" 
            required 
            aria-required="true"
            aria-describedby="email-error"
          >
        </div>
        <div class="form-error-msg" id="email-error" role="alert"></div>
      </div>

      <div class="form-group" id="group-password">
        <label for="password" class="form-label">Password</label>
        <div class="input-icon-wrapper">
          <span class="leading-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input" 
            placeholder="Create a strong password (min 8 chars)" 
            autocomplete="new-password" 
            required 
            aria-required="true"
            aria-describedby="password-error"
          >
          <button 
            type="button" 
            class="trailing-btn" 
            id="togglePasswordBtn" 
            aria-label="Show password"
            onclick="togglePassword('password', this)"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="form-error-msg" id="password-error" role="alert"></div>
      </div>

      <div class="form-group" id="group-confirmPassword">
        <label for="confirmPassword" class="form-label">Confirm password</label>
        <div class="input-icon-wrapper">
          <span class="leading-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            class="input" 
            placeholder="Confirm your password" 
            autocomplete="new-password" 
            required 
            aria-required="true"
            aria-describedby="confirmPassword-error"
          >
          <button 
            type="button" 
            class="trailing-btn" 
            id="toggleConfirmPasswordBtn" 
            aria-label="Show confirm password"
            onclick="togglePassword('confirmPassword', this)"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="form-error-msg" id="confirmPassword-error" role="alert"></div>
      </div>

      <div class="form-group" id="group-terms" style="margin-bottom: 24px;">
        <label class="checkbox-label" for="terms">
          <input 
            type="checkbox" 
            id="terms" 
            name="terms" 
            required 
            aria-required="true"
            aria-describedby="terms-error"
          >
          <span>I agree to the <a href="#" style="color: var(--primary); text-decoration: underline;">Terms of Service</a> and <a href="#" style="color: var(--primary); text-decoration: underline;">Privacy Policy</a></span>
        </label>
        <div class="form-error-msg" id="terms-error" role="alert" style="margin-left: 24px;"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="signupSubmitBtn" style="padding: 12px;">
        <span>Create account &rarr;</span>
      </button>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <!-- Disabled Social Buttons Matching Mockup -->
      <button type="button" class="social-auth-btn" disabled aria-disabled="true" title="Social sign-in is disabled">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <button type="button" class="social-auth-btn" disabled aria-disabled="true" title="Social sign-in is disabled">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        <span>Continue with GitHub</span>
      </button>

      <div class="auth-footer">
        Already have an account? <a href="/login">Log in</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}

{% block scripts %}
{% endblock %}
