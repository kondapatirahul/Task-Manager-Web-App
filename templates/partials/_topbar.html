<!-- TaskNest Topbar -->
<header class="app-topbar" aria-label="Topbar">
  <div class="topbar-search">
    <span class="search-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
    <input type="text" id="globalSearchInput" placeholder="Search tasks..." aria-label="Search tasks">
  </div>

  <div class="topbar-actions">
    <button type="button" class="icon-btn-badge" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="badge-dot" aria-hidden="true"></span>
    </button>

    <div class="user-profile-chip" id="userMenuBtn" role="button" tabindex="0" aria-label="User Profile">
      <div class="avatar-circle" id="userAvatar">A</div>
      <span class="user-name" id="userNameDisplay">Alex</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
  </div>
</header>
