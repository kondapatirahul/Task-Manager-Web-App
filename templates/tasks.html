
{% extends 'base.html' %}

{% block title %}My Tasks - TaskNest{% endblock %}

{% block content %}
<div class="tasks-header" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px;">
  <div>
    <h1 style="font-size:26px;font-weight:700;color:var(--text-main);margin-bottom:4px;">My Tasks</h1>
    <p style="font-size:14px;color:var(--text-muted);">Manage and organize all your daily goals.</p>
  </div>

  <button type="button" class="btn btn-primary" id="openAddTaskModalBtn">
    <span>+ Add Task</span>
  </button>
</div>

<!-- Search and Filter -->
<div class="card" style="padding:16px;margin-bottom:20px;">
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <input
      type="search"
      id="taskSearch"
      class="form-control"
      placeholder="Search your tasks..."
      aria-label="Search tasks"
      style="flex:1;min-width:200px;"
    >

    <select id="taskFilter" class="form-control" aria-label="Filter tasks" style="min-width:150px;">
      <option value="all">All Tasks</option>
      <option value="pending">Pending</option>
      <option value="completed">Completed</option>
    </select>
  </div>
</div>

<!-- Task List -->
<div id="taskList" aria-live="polite">
  <div class="card" style="padding:32px;text-align:center;">
    Loading tasks...
  </div>
</div>

<!-- Add / Edit Task Modal -->
<div
  id="taskModal"
  hidden
  style="position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;"
>
  <section
    class="card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="taskModalTitle"
    style="width:100%;max-width:500px;padding:24px;background:var(--bg-card,#fff);"
  >
    <h2 id="taskModalTitle" style="margin-bottom:20px;">Add Task</h2>

    <form id="taskForm">
      <div style="margin-bottom:16px;">
        <label for="taskTitle" style="display:block;margin-bottom:8px;">Task Title *</label>
        <input
          type="text"
          id="taskTitle"
          name="title"
          maxlength="200"
          required
          placeholder="Enter task title"
          style="width:100%;padding:11px;border:1px solid var(--border-color,#ddd);border-radius:8px;box-sizing:border-box;"
        >
      </div>

      <div style="margin-bottom:16px;">
        <label for="taskDescription" style="display:block;margin-bottom:8px;">Description</label>
        <textarea
          id="taskDescription"
          name="description"
          rows="3"
          placeholder="Add task details..."
          style="width:100%;padding:11px;border:1px solid var(--border-color,#ddd);border-radius:8px;box-sizing:border-box;resize:vertical;"
        ></textarea>
      </div>

      <div style="margin-bottom:20px;">
        <label for="taskPriority" style="display:block;margin-bottom:8px;">Priority</label>
        <select
          id="taskPriority"
          name="priority"
          style="width:100%;padding:11px;border:1px solid var(--border-color,#ddd);border-radius:8px;box-sizing:border-box;"
        >
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">
        <button type="button" class="btn btn-secondary" id="cancelTaskBtn">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          Save Task
        </button>
      </div>
    </form>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>

<script>
  // Show modal using flex while preserving the hidden state.
  document.addEventListener('DOMContentLoaded', function () {
    const modal = document.getElementById('taskModal');
    const addButton = document.getElementById('openAddTaskModalBtn');

    if (addButton && modal) {
      addButton.addEventListener('click', function () {
        modal.style.display = 'flex';
      });
    }

    if (modal) {
      const observer = new MutationObserver(function () {
        if (modal.hidden) {
          modal.style.display = 'none';
        }
      });

      observer.observe(modal, { attributes: true, attributeFilter: ['hidden'] });
    }
  });
</script>
{% endblock %}
