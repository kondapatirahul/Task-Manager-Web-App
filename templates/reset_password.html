{% extends "base.html" %}

{% block title %}Set New Password — TaskNest{% endblock %}

{% block body %}
<div class="auth-page-wrapper" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; background-color: var(--color-bg);">
  <div class="auth-card" style="width: 100%; max-width: 440px; background-color: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 2.25rem;">
    
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <a href="/" style="display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; margin-bottom: 1rem;">
        <div style="width: 32px; height: 32px; border-radius: var(--radius-sm); background-color: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center;">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        </div>
        <span style="font-weight: 800; font-size: var(--font-size-base); color: var(--color-primary);">TaskNest</span>
      </a>
      <h2 style="font-size: var(--font-size-xl); font-weight: 800; color: var(--color-primary); margin-bottom: 0.35rem;">Set New Password</h2>
      <p style="font-size: var(--font-size-xs); color: var(--color-muted); margin: 0;">
        Create a new, strong password for your TaskNest account.
      </p>
    </div>

    <div id="reset-alert" class="alert alert-danger" style="display: none; font-size: var(--font-size-xs); margin-bottom: 1.25rem;">
      <span id="reset-alert-text"></span>
    </div>

    <div id="reset-success-alert" class="alert alert-success" style="display: none; font-size: var(--font-size-xs); margin-bottom: 1.25rem;">
      Password updated successfully! Redirecting to login...
    </div>

    <form id="reset-form">
      <input type="hidden" id="reset-token" value="{{ token }}">

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label" for="reset-pass" style="font-weight: 600; font-size: var(--font-size-xs);">New Password <span class="required">*</span></label>
        <input type="password" id="reset-pass" class="form-control" required placeholder="Min 8 characters">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="reset-confirm" style="font-weight: 600; font-size: var(--font-size-xs);">Confirm New Password <span class="required">*</span></label>
        <input type="password" id="reset-confirm" class="form-control" required placeholder="Re-type new password">
      </div>

      <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-block" style="padding: 0.75rem; font-weight: 700;">
        Update Password
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--color-border); padding-top: 1rem; font-size: var(--font-size-xs);">
      <a href="/login" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">&larr; Return to Sign In</a>
    </div>

  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('reset-form');
  const token = document.getElementById('reset-token').value;
  const passInput = document.getElementById('reset-pass');
  const confirmInput = document.getElementById('reset-confirm');
  const alertBox = document.getElementById('reset-alert');
  const alertText = document.getElementById('reset-alert-text');
  const successBox = document.getElementById('reset-success-alert');
  const submitBtn = document.getElementById('reset-submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.style.display = 'none';

    const password = passInput.value;
    const confirmPassword = confirmInput.value;

    if (!password || password.length < 8) {
      alertText.textContent = 'Password must be at least 8 characters long.';
      alertBox.style.display = 'block';
      return;
    }

    if (password !== confirmPassword) {
      alertText.textContent = 'Passwords do not match.';
      alertBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    try {
      await api('POST', '/auth/reset-password', {
        token,
        password,
        confirm_password: confirmPassword
      });

      successBox.style.display = 'block';
      form.style.display = 'none';
      setTimeout(() => {
        window.location.href = '/login';
      }, 1500);
    } catch (err) {
      alertText.textContent = err.message || 'Failed to reset password.';
      alertBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
    }
  });
});
</script>
{% endblock %}
